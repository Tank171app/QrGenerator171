name: Build APK (Android)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pasang Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Pasang dependensi
        working-directory: android-app
        run: npm ci

      - name: Siapkan file aplikasi
        run: |
          mkdir -p android-app/www
          cp web/index.html android-app/www/index.html

      - name: Tambah platform Android
        working-directory: android-app
        run: npx cap add android

      - name: Sinkronkan aplikasi & ikon
        run: |
          cd android-app
          npx cap sync android
          cp -r ../icons/android/mipmap-* android/app/src/main/res/
          cp ../icons/values/ic_launcher_background.xml android/app/src/main/res/values/
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <application|' android/app/src/main/AndroidManifest.xml
          grep -q 'permission.CAMERA' android/app/src/main/AndroidManifest.xml
          grep -q 'QR Generator 171' android/app/src/main/res/values/strings.xml

      - name: Build APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Beri nama APK
        run: mv "android-app/android/app/build/outputs/apk/debug/app-debug.apk" "QR Generator 171.apk"

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: QR-Generator-171-APK
          path: QR Generator 171.apk
          if-no-files-found: error
